name: stripe_payment_fulfillment
description: >-
  Fulfil an order when Stripe reports a successful payment, then emit an
  internal `order.paid` event so follow-up workflows run independently.
trigger:
  source: stripe
  event: payment_intent.succeeded
  filter:
    - { path: payload.data.object.amount, op: gt, value: 0 }
retry:
  max_attempts: 8
  initial_delay: 1s
  max_delay: 10m
steps:
  - id: fulfil
    action: http_request
    with:
      method: POST
      url: "{{ secrets.FULFILLMENT_URL }}"
      # The engine adds `Idempotency-Key: <run>:<generation>:fulfil`, stable
      # across retries, so the fulfilment API can deduplicate.
      json:
        payment_intent: "{{ event.payload.data.object.id }}"
        amount: "{{ event.payload.data.object.amount }}"
        currency: "{{ event.payload.data.object.currency }}"
        customer: "{{ event.payload.data.object.customer }}"

  - id: announce
    action: emit_event
    with:
      event_type: order.paid
      payload:
        payment_intent: "{{ event.payload.data.object.id }}"
        fulfilment: "{{ steps.fulfil.output.body }}"
